name: Scroller
options:
  bundleIdPrefix: com.kylan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 82FBZ8GVGB
    CODE_SIGN_STYLE: Automatic
    # App Group identifiers are globally unique across every Apple account.
    # Change it here only — the entitlements and Info.plists below read it.
    APP_GROUP_ID: group.com.kylan.scroller.shared

targets:
  Scroller:
    type: application
    platform: iOS
    sources:
      - path: Scroller
        excludes:
          - "scroller.icon"
      - path: Scroller/scroller.icon
        type: file
      - path: Shared
    dependencies:
      - target: ScrollerShare
        embed: true
    entitlements:
      path: Scroller/Scroller.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Scroller/Info.plist
      properties:
        CFBundleDisplayName: Scroller
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        # Scroller has no networking and no cryptography: recognition is
        # on-device and scripts never leave the phone. Declaring it here means
        # App Store Connect stops asking on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Scroller listens while you read so the script follows your pace.
        NSSpeechRecognitionUsageDescription: Scroller matches what you say against your script so the text can follow along. Recognition runs entirely on your iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylan.scroller
        PRODUCT_NAME: Scroller
        ASSETCATALOG_COMPILER_APPICON_NAME: scroller
        TARGETED_DEVICE_FAMILY: "1"

  ScrollerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ScrollerShare
      - path: Shared
    entitlements:
      path: ScrollerShare/ScrollerShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: ScrollerShare/Info.plist
      properties:
        CFBundleDisplayName: Scroller
        AppGroupIdentifier: $(APP_GROUP_ID)
        # Scroller has no networking and no cryptography: recognition is
        # on-device and scripts never leave the phone. Declaring it here means
        # App Store Connect stops asking on every upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylan.scroller.share
        PRODUCT_NAME: ScrollerShare

        TARGETED_DEVICE_FAMILY: "1"
